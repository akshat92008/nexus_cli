# Foundation Model Bake-Off Candidates
# Nova v12 — Base model selection
# All candidates must be evaluated on identical hardware and prompts.

candidates:
  - id: nanbeige4.2-3b-base
    name: "Nanbeige4.2-3B-Base"
    hf_id: "Nanbeige/Nanbeige4.2-3B"
    params: "~3B"
    licence: "Apache-2.0"
    context_length: 262144
    architecture: "Custom (trust_remote_code)"
    strengths:
      - Code-focused pretraining mixture
      - Agentic model lineage
      - Apache 2.0 licence
      - Very long context
    risks:
      - Custom architecture requiring trust_remote_code
      - Less mature llama.cpp/Ollama support
      - Specialised inference branches
      - Quantisation tooling needs validation
    status: "lead_candidate"

  - id: qwen2.5-coder-3b
    name: "Qwen2.5-Coder-3B-Instruct"
    hf_id: "Qwen/Qwen2.5-Coder-3B-Instruct"
    params: "3B"
    licence: "Apache-2.0"
    context_length: 32768
    architecture: "Dense Transformer (standard)"
    strengths:
      - Known quantity from v11
      - Excellent llama.cpp/Ollama support
      - Strong HumanEval baseline
      - Mature tooling ecosystem
      - Native FIM support
    risks:
      - Already our v11 base — limited novelty
      - 3B may be underpowered vs 3.8B+ competitors
    status: "control"

  - id: phi-4-mini
    name: "Phi-4-mini"
    hf_id: "microsoft/Phi-4-mini-instruct"
    params: "3.8B"
    licence: "MIT"
    context_length: 131072
    architecture: "Dense Transformer"
    strengths:
      - 5T token pretraining
      - MIT licence
      - Strong reasoning benchmarks
      - Good ecosystem support
    risks:
      - Optimised for reasoning, may need more code adaptation
      - Microsoft-specific tokenizer decisions
    status: "strong_candidate"

  - id: qwen2.5-coder-7b
    name: "Qwen2.5-Coder-7B-Instruct"
    hf_id: "Qwen/Qwen2.5-Coder-7B-Instruct"
    params: "7B"
    licence: "Apache-2.0"
    context_length: 131072
    architecture: "Dense Transformer (standard)"
    strengths:
      - Strongest Qwen coder in size class
      - Excellent code benchmarks
      - Good ecosystem support
      - Native FIM
    risks:
      - 7B requires Q4 to fit in 8GB — may exceed 4B target
      - Higher training cost
      - Could be the 8B variant base, not the 4B hero
    status: "candidate_for_8b_variant"

  - id: mistral-small
    name: "Mistral Small"
    hf_id: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
    params: "~24B"
    licence: "Apache-2.0"
    context_length: 131072
    architecture: "Dense Transformer"
    strengths:
      - Strong instruction following
      - Good ecosystem support
    risks:
      - 24B is far too large for the 4B hero model
      - Would need a smaller Mistral variant
    notes: "Check for a smaller Mistral model (3B-7B range) at evaluation time"
    status: "needs_smaller_variant"

# Bake-off scoring weights (Section 4 of blueprint)
scoring:
  code_correctness: 0.25
  debugging_repair: 0.15
  repository_tasks: 0.15
  tool_use: 0.10
  fim_completion: 0.10
  instruction_following: 0.10
  quantised_performance: 0.05
  speed_memory: 0.05
  licence_ecosystem: 0.05

# Evaluation parameters
evaluation:
  hardware: "Apple Silicon M3 8GB"
  temperature: 0.0
  max_tokens: 2048
  num_prompts_per_category:
    code_generation: 50
    debugging: 20
    repository_editing: 20
    tool_use: 15
    fim: 20
    instruction_following: 15
  quantisation_for_eval: "Q4_K_M"
