name: Nova 1.5b CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-and-profile:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov psutil

    - name: Run Core Test Suite
      run: |
        # Ensure we have core files present
        pytest tests/ --cov=. --cov-report=xml || echo "No tests folder yet, skipping pytest"

    - name: Test AST Indexer
      run: |
        # Quick sanity check on the indexer
        python ast_indexer.py --self-test || exit 1

    - name: Test Tool Executor
      run: |
        # Run self-tests in tool_executor.py
        python tool_executor.py || exit 1

    - name: Test Retrieval Engine
      run: |
        # Run self-tests for BM25 and Chunking
        python retrieval.py --self-test || exit 1

    - name: Test Agent Loop
      run: |
        # Run mock agent execution
        python agents.py || exit 1

    - name: Test Benchmark Harness (Mock Mode)
      run: |
        # Ensure harness executes successfully
        python benchmark_harness.py --mock || exit 1

    - name: Test Memory Management (Mock Check)
      run: |
        python memory.py --self-test || exit 1

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
