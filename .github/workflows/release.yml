name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install exact locked environment
        run: uv sync --locked --extra dev --extra browser

      - name: Install and verify kernel sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          uv run python - <<'PY'
          from pathlib import Path
          from nexus.sandbox import SandboxBackend, SandboxRunner
          backend = SandboxRunner(Path.cwd()).backend()
          if backend is not SandboxBackend.BUBBLEWRAP:
              raise SystemExit(f"release runner is not kernel-confined: {backend.value}")
          print(f"kernel sandbox verified: {backend.value}")
          PY

      - name: Run deterministic release gate
        run: uv run python scripts/run_release_gate.py

      - name: Run offline command scenarios
        run: uv run python scripts/run_offline_scenarios.py

      - name: Require live provider configuration
        env:
          NEXUS_OPENAI_API_KEY: ${{ secrets.NEXUS_RELEASE_PROVIDER_API_KEY }}
          NEXUS_OPENAI_BASE_URL: ${{ secrets.NEXUS_RELEASE_PROVIDER_BASE_URL }}
          NEXUS_MODEL_ID: ${{ secrets.NEXUS_RELEASE_PROVIDER_MODEL_ID }}
        run: |
          test -n "$NEXUS_OPENAI_API_KEY"
          test -n "$NEXUS_OPENAI_BASE_URL"
          test -n "$NEXUS_MODEL_ID"

      - name: Run live prompt-to-tested-code gate
        env:
          NEXUS_OPENAI_API_KEY: ${{ secrets.NEXUS_RELEASE_PROVIDER_API_KEY }}
          NEXUS_OPENAI_BASE_URL: ${{ secrets.NEXUS_RELEASE_PROVIDER_BASE_URL }}
          NEXUS_MODEL_ID: ${{ secrets.NEXUS_RELEASE_PROVIDER_MODEL_ID }}
        run: >-
          uv run python scripts/run_release_e2e.py
          --model custom
          --model-id "$NEXUS_MODEL_ID"
          --scenario 02_python_surgical_bugfix
          --artifact-root release-evidence

      - name: Run release-blocking long-horizon qualification
        env:
          NEXUS_OPENAI_API_KEY: ${{ secrets.NEXUS_RELEASE_PROVIDER_API_KEY }}
          NEXUS_OPENAI_BASE_URL: ${{ secrets.NEXUS_RELEASE_PROVIDER_BASE_URL }}
          NEXUS_MODEL_ID: ${{ secrets.NEXUS_RELEASE_PROVIDER_MODEL_ID }}
          NEXUS_RUN_LIVE_PROVIDER: "1"
        run: >-
          uv run python scripts/run_live_provider_gate.py
          --allow-cost
          --manifest benchmarks/release_long_horizon.json
          --model custom
          --model-id "$NEXUS_MODEL_ID"
          --trials 3
          --required-pass-rate 1.0
          --artifact-root release-evidence/long-horizon

      - name: Build exact release artifacts
        run: |
          uv run python -m build
          sha256sum dist/* > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-cli-${{ github.sha }}
          path: |
            dist/*
            release-evidence/**
          if-no-files-found: error
