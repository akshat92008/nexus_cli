[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amaura-nova-v12"
version = "0.1.0"
description = "Execution-grounded model development toolkit for Amaura Nova v12"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Amaura Labs"}]
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
data = [
  "datasets>=2.18",
  "transformers>=4.45",
  "datasketch>=1.6",
  "tree-sitter>=0.22",
  "tree-sitter-language-pack>=0.6",
]
train = [
  "torch>=2.1",
  "transformers>=4.45",
  "datasets>=2.18",
  "accelerate>=0.30",
  "peft>=0.12",
  "trl>=0.11",
]
eval = ["transformers>=4.45", "torch>=2.1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
all = ["amaura-nova-v12[data,train,eval,dev]"]

[project.scripts]
nova-v12 = "nova_v12.cli:main"
nova-v12-cpt = "nova_v12.training.stage1_cpt:main"
nova-v12-sft = "nova_v12.training.stage2_sft:main"
nova-v12-distill = "nova_v12.training.stage3_distill:main"
nova-v12-dpo = "nova_v12.training.stage4_dpo:main"
nova-v12-export = "nova_v12.training.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
