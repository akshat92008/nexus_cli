input:
  kind: jsonl
  adapter: generic
  paths:
    - examples/code_records.jsonl
output:
  records: runs/example-data/records.jsonl
  manifest: runs/example-data/manifest.json
  dedup_db: runs/example-data/dedup.sqlite3
filters:
  licence_allowlist: [mit]
  min_quality_score: 0.70
  reject_pii: true
  max_file_bytes: 1000000
limits:
  max_records: 100
