base_model: runs/cpt-pilot
revision: null
train_files:
  - data/training/sft_train.jsonl
validation_files:
  - data/training/sft_validation.jsonl
output_dir: runs/sft-pilot
seed: 42
max_length: 8192
learning_rate: 0.00005
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
logging_steps: 10
save_steps: 250
warmup_ratio: 0.03
bf16: true
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
assistant_only_loss: true
