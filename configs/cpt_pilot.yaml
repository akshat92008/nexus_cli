base_model: REPLACE_WITH_SELECTED_BASE
revision: null
train_files:
  - data/training/cpt_train.jsonl
validation_files:
  - data/training/cpt_validation.jsonl
output_dir: runs/cpt-pilot
seed: 42
max_length: 4096
learning_rate: 0.0001
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
logging_steps: 10
save_steps: 250
warmup_ratio: 0.03
bf16: true
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
fim_rate: 0.35
pack_sequences: true

# Set streaming=true and max_steps>0 for corpora that should not be loaded into RAM.
streaming: false
max_steps: -1
