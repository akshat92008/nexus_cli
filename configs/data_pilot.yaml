input:
  kind: jsonl
  paths:
    - data/raw/code.jsonl
output:
  records: data/processed/code.filtered.jsonl
  manifest: data/processed/manifest.json
  dedup_db: data/state/exact_dedup.sqlite3
filters:
  licence_allowlist:
    - mit
    - apache-2.0
    - bsd-2-clause
    - bsd-3-clause
    - isc
    - unlicense
    - cc0-1.0
  min_quality_score: 0.70
  reject_pii: true
  max_file_bytes: 1000000
  near_dedup_threshold: 0.85
  enable_near_dedup: false
  contamination_signatures: configs/contamination_signatures.json
limits:
  max_records: 10000
  max_tokens: 50000000
